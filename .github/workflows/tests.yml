name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Python CLI, concurrency lock & MCP tests
        run: python -m unittest discover -s tests -v

      - name: Run DeepSeek Harness plugin bundle checks
        working-directory: integrations/deepseek-harness
        run: npm run check
